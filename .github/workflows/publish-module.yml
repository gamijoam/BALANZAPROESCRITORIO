name: Publicar módulo firmado

on:
  workflow_dispatch:
    inputs:
      module:
        description: Módulo que se compilará y publicará
        required: true
        type: choice
        options:
          - all
          - warehouses
          - thermal-receipts
          - advanced-reports
          - finance

permissions:
  contents: read
  actions: read

jobs:
  build-unsigned-package:
    if: github.ref == 'refs/heads/main'
    runs-on: windows-latest
    steps:
      - name: Descargar el código de main
        uses: actions/checkout@v4

      - name: Instalar .NET 10
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - name: Probar el empaquetador y el firmador
        run: dotnet test .\tests\Pos.Modules.Tests\Pos.Modules.Tests.csproj --configuration Release --filter "FullyQualifiedName~PublisherWorkflowTests|FullyQualifiedName~ModulePublisherInputTests|FullyQualifiedName~ModulePackageVerifierTests"

      - name: Comprobar que la opción todos incluye el catálogo distribuible
        shell: pwsh
        run: .\tests\scripts\Test-AllModulePublishingAcceptance.ps1

      - name: Comprobar firma DER y limpieza del runner
        shell: pwsh
        run: .\tests\scripts\Test-ModuleSigningWorkflowAcceptance.ps1

      - name: Compilar el módulo y preparar el paquete sin firma
        shell: pwsh
        env:
          MODULE_TO_PUBLISH: ${{ inputs.module }}
        run: .\scripts\Prepare-ModulePackageForSigning.ps1 -Module $env:MODULE_TO_PUBLISH

      - name: Enviar paquete temporal al firmador privado
        uses: actions/upload-artifact@v4
        with:
          name: module-release-input
          path: |
            artifacts/module-release-input/unsigned/
            artifacts/module-release-input/publisher/
            artifacts/module-release-input/trusted-publisher.pem
          if-no-files-found: error
          retention-days: 1

  sign-and-publish:
    if: github.ref == 'refs/heads/main'
    needs: build-unsigned-package
    runs-on: [self-hosted, linux, x64, pos-module-signing]
    environment: module-signing
    steps:
      - name: Recibir el paquete temporal
        uses: actions/download-artifact@v4
        with:
          name: module-release-input
          path: ${{ runner.temp }}/module-signing-${{ github.run_id }}-${{ github.run_attempt }}/incoming

      - name: Validar, firmar y exportar solo archivos públicos
        shell: bash
        env:
          POS_MODULE_SIGNING_KEY: /etc/pos-module-signer/pos-publisher-vps-2026-private.pem
          PUBLISH_MODULE_INPUT: ${{ inputs.module }}
        run: |
          set -euo pipefail
          RUN_ROOT="${RUNNER_TEMP}/module-signing-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          mapfile -t unsigned_packages < <(find "$RUN_ROOT/incoming/unsigned" -maxdepth 1 -type f -name '*-unsigned.zip' -print)
          case "$PUBLISH_MODULE_INPUT" in
            all) expected_modules=(warehouses thermal-receipts advanced-reports finance) ;;
            warehouses|thermal-receipts|advanced-reports|finance) expected_modules=("$PUBLISH_MODULE_INPUT") ;;
            *) echo "Selección de módulo inválida." >&2; exit 1 ;;
          esac
          if [ "${#unsigned_packages[@]}" -ne "${#expected_modules[@]}" ]; then
            echo "Se recibieron ${#unsigned_packages[@]} paquetes; se esperaban ${#expected_modules[@]}." >&2
            exit 1
          fi
          for module_id in "${expected_modules[@]}"; do
            matches=0
            for package in "${unsigned_packages[@]}"; do
              case "$(basename "$package")" in
                "$module_id-"*-unsigned.zip) matches=$((matches + 1)) ;;
              esac
            done
            if [ "$matches" -ne 1 ]; then
              echo "Falta el paquete esperado del módulo $module_id." >&2
              exit 1
            fi
          done
          publisher="$(find "$RUN_ROOT/incoming/publisher" -maxdepth 1 -type f -name 'Pos.Modules.Publisher' -print -quit)"
          if [ -z "$publisher" ]; then
            echo "No se recibió el publicador Linux autónomo." >&2
            exit 1
          fi
          chmod u+x "$publisher"
          mkdir -p "$RUN_ROOT/signed"
          for unsigned_package in "${unsigned_packages[@]}"; do
            package_name="$(basename "$unsigned_package" -unsigned.zip).zip"
            signed_package="$RUN_ROOT/signed/$package_name"
            "$publisher" sign-package \
              --input "$unsigned_package" \
              --output "$signed_package" \
              --private-key-pem "$POS_MODULE_SIGNING_KEY"
            (cd "$RUN_ROOT/signed" && sha256sum "$package_name" > "$package_name.sha256")
          done
          "$publisher" export-public-key \
            --private-key-pem "$POS_MODULE_SIGNING_KEY" \
            --output "$RUN_ROOT/signed/publisher-public.pem"
          openssl pkey -pubin -in "$RUN_ROOT/incoming/trusted-publisher.pem" \
            -outform DER -out "$RUN_ROOT/trusted-publisher.der"
          openssl pkey -in "$POS_MODULE_SIGNING_KEY" -pubout \
            -outform DER -out "$RUN_ROOT/signer-public.der"
          cmp --silent "$RUN_ROOT/trusted-publisher.der" "$RUN_ROOT/signer-public.der" || {
            echo "La clave privada del VPS no corresponde a la clave pública confiable del repositorio." >&2
            exit 1
          }

      - name: Publicar ZIP firmado, clave pública y SHA-256
        uses: actions/upload-artifact@v4
        with:
          name: signed-module-output
          path: |
            ${{ runner.temp }}/module-signing-${{ github.run_id }}-${{ github.run_attempt }}/signed/*.zip
            ${{ runner.temp }}/module-signing-${{ github.run_id }}-${{ github.run_attempt }}/signed/publisher-public.pem
            ${{ runner.temp }}/module-signing-${{ github.run_id }}-${{ github.run_attempt }}/signed/*.sha256
          if-no-files-found: error
          retention-days: 3

      - name: Limpiar archivos temporales
        if: always()
        shell: bash
        run: rm -rf -- "${RUNNER_TEMP}/module-signing-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"

  publish-releases:
    name: Publicar versiones instalables de módulos
    if: github.ref == 'refs/heads/main'
    needs: sign-and-publish
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Descargar historial para describir los cambios
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Recibir ZIP firmados
        uses: actions/download-artifact@v4
        with:
          name: signed-module-output
          path: release
      - name: Crear o actualizar Releases de módulos
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          shopt -s nullglob
          packages=(release/*.zip)
          if [ "${#packages[@]}" -eq 0 ]; then
            echo 'No se recibieron módulos firmados.' >&2
            exit 1
          fi
          for package in "${packages[@]}"; do
            module_id="$(unzip -p "$package" module.manifest.json | jq -r '.id')"
            version="$(unzip -p "$package" module.manifest.json | jq -r '.version')"
            display_name="$(unzip -p "$package" module.manifest.json | jq -r '.displayName // .id')"
            if [[ ! "$module_id" =~ ^[a-z][a-z0-9-]*$ || ! "$version" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
              echo "Identidad inválida en $package" >&2
              exit 1
            fi
            tag="module-${module_id}-v${version}"
            checksum="${package}.sha256"
            if [ ! -f "$checksum" ]; then
              echo "Falta la suma SHA-256 de $package" >&2
              exit 1
            fi
            if gh release view "$tag" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
              gh release upload "$tag" "$package" "$checksum" --clobber --repo "$GITHUB_REPOSITORY"
            else
              case "$module_id" in
                warehouses) source_dir='src/Modules/Pos.Modules.Warehouses' ;;
                thermal-receipts) source_dir='src/Modules/Pos.Modules.ThermalReceipts' ;;
                advanced-reports) source_dir='src/Modules/Pos.Modules.Reporting.Desktop' ;;
                finance) source_dir='src/Modules/Pos.Modules.Finance' ;;
                *) echo "Módulo desconocido: $module_id" >&2; exit 1 ;;
              esac
              previous_tag="$(git tag --list "module-${module_id}-v*" --sort=-version:refname | head -n 1)"
              notes_file="${RUNNER_TEMP}/module-${module_id}-notes.md"
              printf '# %s %s\n\n' "$display_name" "$version" > "$notes_file"
              if [ -n "$previous_tag" ]; then
                git log --pretty=format:'- %s%n' "${previous_tag}..HEAD" -- "$source_dir" >> "$notes_file"
              else
                printf 'Primera versión publicada de este módulo.\n' >> "$notes_file"
              fi
              if [ "$(wc -l < "$notes_file")" -le 2 ]; then
                printf 'Actualización del módulo sin cambios descritos en el historial.\n' >> "$notes_file"
              fi
              gh release create "$tag" "$package" "$checksum" \
                --target main --title "$display_name $version" \
                --notes-file "$notes_file" \
                --repo "$GITHUB_REPOSITORY"
            fi
          done

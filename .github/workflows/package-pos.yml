name: Empaquetar POS para Windows

on:
  workflow_dispatch:
    inputs:
      release_tag:
        description: "Etiqueta pos-v* cuya Release recibirá el ZIP; déjala vacía para solo generar un artifact"
        required: false
        type: string
  pull_request:
    branches: [main]
    paths:
      - 'src/**'
      - 'scripts/**'
      - 'security/**'
      - 'docs/manuales/INSTRUCCIONES-INSTALACION-POS.md'
      - 'docs/runbooks/importar-saldos-iniciales-legado.md'
      - 'docs/security/publicar-modulos-desde-cualquier-equipo.md'

permissions:
  contents: read

jobs:
  package:
    name: Compilar y empaquetar win-x64
    if: ${{ github.event_name == 'pull_request' || github.event_name == 'workflow_dispatch' }}
    runs-on: windows-latest
    steps:
      - name: Descargar el código
        uses: actions/checkout@v4
        with:
          ref: ${{ github.ref }}
          fetch-depth: 0

      - name: Validar y preparar etiqueta de Release
        if: github.event_name == 'workflow_dispatch' && inputs.release_tag != ''
        shell: pwsh
        env:
          RELEASE_TAG: ${{ inputs.release_tag }}
        run: |
          $tag = $env:RELEASE_TAG
          if ($env:GITHUB_REF -ne 'refs/heads/main') {
            throw 'Para publicar una Release, ejecuta el workflow desde main. Para compilar una rama de prueba, deja vacía la etiqueta.'
          }
          if ($tag -notmatch '^pos-v[0-9]+(\.[0-9]+){2,3}$') {
            throw 'La etiqueta debe tener el formato pos-vX.Y.Z o pos-vAAAA.MM.DD.N.'
          }
          git fetch --no-tags origin '+refs/heads/main:refs/remotes/origin/main' --quiet
          if ($LASTEXITCODE -ne 0) { throw 'No se pudo consultar la rama main para validar la Release.' }
          $tagRefspec = '+refs/tags/{0}:refs/tags/{0}' -f $tag
          git fetch --force origin $tagRefspec --quiet
          if ($LASTEXITCODE -ne 0) { throw "No existe la etiqueta '$tag' en GitHub. Créala y súbela antes de generar la Release." }
          git checkout --detach "refs/tags/$tag"
          if ($LASTEXITCODE -ne 0) { throw "No se pudo cambiar al código de la etiqueta '$tag'." }
          git merge-base --is-ancestor HEAD origin/main
          if ($LASTEXITCODE -ne 0) { throw 'La etiqueta debe apuntar a un commit aprobado de main.' }

      - name: Instalar .NET 10
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - name: Publicar servidor, escritorio y actualizador
        shell: pwsh
        env:
          RELEASE_TAG: ${{ inputs.release_tag }}
        run: |
          $version = if ($env:RELEASE_TAG -match '^pos-v(\d+\.\d+\.\d+(?:\.\d+)?)$') { $Matches[1] } else { '0.0.0' }
          .\scripts\Publish-LocalPos.ps1 -ReleaseVersion $version

      - name: Subir paquete descargable para probar
        if: ${{ github.event_name == 'pull_request' || (github.event_name == 'workflow_dispatch' && inputs.release_tag == '') }}
        uses: actions/upload-artifact@v4
        with:
          name: BALANZAPRO-POS-win-x64-${{ github.sha }}
          path: artifacts/local-pos/**
          if-no-files-found: error
          retention-days: 3

      - name: Enviar ZIP al firmador privado
        if: ${{ github.event_name == 'workflow_dispatch' && inputs.release_tag != '' }}
        uses: actions/upload-artifact@v4
        with:
          name: pos-release-input
          path: artifacts/local-pos-win-x64.zip
          if-no-files-found: error
          retention-days: 1

  sign-release:
    name: Firmar paquete POS oficial
    if: ${{ github.event_name == 'workflow_dispatch' && inputs.release_tag != '' && github.ref == 'refs/heads/main' }}
    needs: package
    runs-on: [self-hosted, linux, x64, pos-module-signing]
    environment: module-signing
    steps:
      - name: Descargar código aprobado
        uses: actions/checkout@v4
        with:
          ref: main
      - name: Recibir ZIP construido en Windows
        uses: actions/download-artifact@v4
        with:
          name: pos-release-input
          path: ${{ runner.temp }}/pos-update-${{ github.run_id }}-${{ github.run_attempt }}/incoming
      - name: Comprobar clave y firmar inventario del paquete
        shell: bash
        env:
          RELEASE_TAG: ${{ inputs.release_tag }}
          POS_UPDATE_SIGNING_KEY: /etc/pos-module-signer/pos-publisher-vps-2026-private.pem
        run: |
          set -euo pipefail
          run_root="${RUNNER_TEMP}/pos-update-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          openssl pkey -pubin -in security/module-publishers/pos-publisher-vps-2026.pem -outform DER -out "$run_root/trusted.der"
          openssl pkey -in "$POS_UPDATE_SIGNING_KEY" -pubout -outform DER -out "$run_root/signer.der"
          cmp --silent "$run_root/trusted.der" "$run_root/signer.der"
          python3 scripts/Sign-PosUpdateArchive.py \
            --input "$run_root/incoming/local-pos-win-x64.zip" \
            --output "$run_root/signed/local-pos-win-x64.zip" \
            --private-key "$POS_UPDATE_SIGNING_KEY" \
            --version "${RELEASE_TAG#pos-v}"
      - name: Enviar paquete oficial firmado
        uses: actions/upload-artifact@v4
        with:
          name: pos-release-files
          path: |
            ${{ runner.temp }}/pos-update-${{ github.run_id }}-${{ github.run_attempt }}/signed/local-pos-win-x64.zip
            ${{ runner.temp }}/pos-update-${{ github.run_id }}-${{ github.run_attempt }}/signed/local-pos-win-x64.zip.sha256
          if-no-files-found: error
          retention-days: 1
      - name: Limpiar archivos del firmador
        if: always()
        shell: bash
        run: rm -rf -- "${RUNNER_TEMP}/pos-update-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"

  publish-release:
    name: Publicar Release versionada
    if: ${{ github.event_name == 'workflow_dispatch' && inputs.release_tag != '' && github.ref == 'refs/heads/main' }}
    needs: sign-release
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Descargar el paquete de Release
        uses: actions/download-artifact@v4
        with:
          name: pos-release-files
          path: release

      - name: Crear o actualizar el Release
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ inputs.release_tag }}
        shell: bash
        run: |
          set -euo pipefail
          tag="$RELEASE_TAG"
          if gh release view "$tag" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            gh release upload "$tag" \
              release/local-pos-win-x64.zip \
              release/local-pos-win-x64.zip.sha256 \
              --clobber \
              --repo "$GITHUB_REPOSITORY"
          else
            gh release create "$tag" \
              release/local-pos-win-x64.zip \
              release/local-pos-win-x64.zip.sha256 \
              --verify-tag \
              --title "BALANZAPRO POS $tag" \
              --generate-notes \
              --repo "$GITHUB_REPOSITORY"
          fi

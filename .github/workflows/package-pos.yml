name: Empaquetar POS para Windows

on:
  workflow_dispatch:
    inputs:
      release_tag:
        description: "Etiqueta pos-v* cuya Release recibirá el ZIP; déjala vacía para solo generar un artifact"
        required: false
        type: string
  release:
    types: [published]

permissions:
  contents: read

jobs:
  package:
    name: Compilar y empaquetar win-x64
    if: ${{ github.event_name != 'release' || startsWith(github.event.release.tag_name, 'pos-v') }}
    runs-on: windows-latest
    steps:
      - name: Descargar el código
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.release_tag || github.event.release.tag_name || github.ref }}

      - name: Validar etiqueta de Release solicitada
        if: github.event_name == 'workflow_dispatch' && inputs.release_tag != ''
        shell: pwsh
        env:
          RELEASE_TAG: ${{ inputs.release_tag }}
        run: |
          if ($env:RELEASE_TAG -notmatch '^pos-v[0-9]+(\.[0-9]+){1,3}$') {
            throw 'La etiqueta debe tener el formato pos-vX.Y.Z o pos-vAAAA.MM.DD.N.'
          }

      - name: Instalar .NET 10
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - name: Publicar servidor, escritorio y actualizador
        shell: pwsh
        run: .\scripts\Publish-LocalPos.ps1

      - name: Crear suma de comprobación del paquete de Release
        if: ${{ (github.event_name == 'release' && startsWith(github.event.release.tag_name, 'pos-v')) || (github.event_name == 'workflow_dispatch' && inputs.release_tag != '') }}
        shell: pwsh
        run: |
          $archive = 'artifacts\local-pos-win-x64.zip'
          $hash = (Get-FileHash -LiteralPath $archive -Algorithm SHA256).Hash.ToLowerInvariant()
          "$hash  local-pos-win-x64.zip" | Set-Content -LiteralPath 'artifacts\local-pos-win-x64.zip.sha256' -Encoding ascii

      - name: Subir paquete descargable para probar
        uses: actions/upload-artifact@v4
        with:
          name: BALANZAPRO-POS-win-x64-${{ github.sha }}
          path: artifacts/local-pos/**
          if-no-files-found: error
          retention-days: 30

      - name: Preparar archivos de Release
        if: ${{ (github.event_name == 'release' && startsWith(github.event.release.tag_name, 'pos-v')) || (github.event_name == 'workflow_dispatch' && inputs.release_tag != '') }}
        uses: actions/upload-artifact@v4
        with:
          name: pos-release-files
          path: |
            artifacts/local-pos-win-x64.zip
            artifacts/local-pos-win-x64.zip.sha256
          if-no-files-found: error
          retention-days: 1

  publish-release:
    name: Publicar Release versionada
    if: ${{ (github.event_name == 'release' && startsWith(github.event.release.tag_name, 'pos-v')) || (github.event_name == 'workflow_dispatch' && inputs.release_tag != '') }}
    needs: package
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Descargar el paquete de Release
        uses: actions/download-artifact@v4
        with:
          name: pos-release-files
          path: release

      - name: Crear o actualizar el Release
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ inputs.release_tag || github.event.release.tag_name || github.ref_name }}
        shell: bash
        run: |
          set -euo pipefail
          tag="$RELEASE_TAG"
          if gh release view "$tag" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            gh release upload "$tag" \
              release/local-pos-win-x64.zip \
              release/local-pos-win-x64.zip.sha256 \
              --clobber \
              --repo "$GITHUB_REPOSITORY"
          else
            gh release create "$tag" \
              release/local-pos-win-x64.zip \
              release/local-pos-win-x64.zip.sha256 \
              --verify-tag \
              --title "BALANZAPRO POS $tag" \
              --generate-notes \
              --repo "$GITHUB_REPOSITORY"
          fi
